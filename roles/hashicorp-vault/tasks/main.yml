---
- name: main.yml - Import prerequisite tasks
  ansible.builtin.import_tasks: pre-req.yml
  tags:
    - pre-req

- name: main.yml - Import user tasks
  ansible.builtin.import_tasks: user.yml
  tags:
    - user

- name: main.yml - Import installation tasks
  ansible.builtin.import_tasks: install.yml
  tags:
    - install

- name: main.yml - Import TLS tasks
  ansible.builtin.include_tasks:
    file: ssl.yml
    apply:
      tags:
        - ssl
  when: hashicorp_vault_tls_enabled | bool
  tags:
    - ssl

- name: main.yml - Import configuration tasks
  ansible.builtin.import_tasks: config.yml
  tags:
    - config

- name: main.yml - Import initialization tasks
  ansible.builtin.import_tasks: init.yml
  tags:
    - init

- name: main.yml - Import cleanup tasks
  ansible.builtin.import_tasks: clean.yml
  tags:
    - never
    - clean
